<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Denúncia - Canal de Denúncias</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Nova Denúncia</h1>
            <p>Preencha o formulário abaixo de forma segura</p>
        </div>
    </header>

    <main class="container">
        <div class="card" style="max-width: 800px; margin: 2rem auto;">
            <div id="mensagem"></div>
            
            <form id="formDenuncia">
                <div class="form-group">
                    <label>Código da Empresa *</label>
                    <input type="number" id="empresa_id" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Denúncia *</label>
                    <select id="tipo" required>
                        <option value="">Selecione...</option>
                        <option value="assedio_moral">Assédio Moral</option>
                        <option value="assedio_sexual">Assédio Sexual</option>
                        <option value="discriminacao">Discriminação</option>
                        <option value="condicao_insegura">Condição Insegura de Trabalho</option>
                        <option value="risco_saude">Risco à Saúde</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descrição da Ocorrência *</label>
                    <textarea id="descricao" required placeholder="Descreva detalhadamente o ocorrido..."></textarea>
                </div>

                <div class="form-group">
                    <label>Setor Envolvido</label>
                    <input type="text" id="setor_envolvido" placeholder="Ex: Produção, Administrativo...">
                </div>

                <div class="form-group">
                    <label>Data da Ocorrência</label>
                    <input type="date" id="data_ocorrencia">
                </div>

                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="anonima" checked>
                        <label for="anonima">Denúncia Anônima</label>
                    </div>
                </div>

                <div id="dadosIdentificacao" style="display: none;">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="denunciante_nome">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="denunciante_email">
                    </div>

                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="tel" id="denunciante_telefone">
                    </div>
                </div>

                <div class="alert alert-info">
                    <strong>Importante:</strong> Após o envio, você receberá um protocolo para acompanhar sua denúncia.
                </div>

                <button type="submit" class="btn btn-primary">Enviar Denúncia</button>
                <a href="index.html" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Canal de Denúncias - CIPA</p>
        </div>
    </footer>

    <script src="js/denuncia.js"></script>
</body>
</html>
